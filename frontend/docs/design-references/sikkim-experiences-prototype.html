/* ===== Design tokens ===== */
:root{
  --bg:#080808; --surface:#111111; --raise:#1a1a1a; --line:#262626;
  --red:#E50914; --red-press:#b20710; --text:#ffffff; --muted:#a8a8a8; --dim:#737373;
  --ok:#46d39a; --warn:#f5b84a;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --font-d:'Bricolage Grotesque',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,sans-serif;
  --top:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--text);font-family:var(--font-b);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Shell ===== */
.shell{min-height:100%;display:flex;justify-content:center;align-items:center;gap:40px;padding:28px}
.phone{position:relative;width:390px;height:844px;flex:none;background:var(--bg);border-radius:46px;overflow:hidden;box-shadow:0 0 0 10px #191919,0 0 0 11px #2a2a2a,0 40px 90px rgba(0,0,0,.7)}
.map-panel{width:250px;max-height:844px;overflow:auto;color:var(--muted);font-size:13px}
.map-panel h2{font-family:var(--font-d);color:#fff;font-size:20px;margin-bottom:4px}
.map-panel p{margin-bottom:14px;line-height:1.45}
.map-panel h3{color:#fff;font-size:12px;margin:14px 0 6px;font-weight:600}
.map-panel button{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:6px;color:#d4d4d4}
.map-panel button:hover{background:var(--raise)}
@media (max-width:820px){
  :root{--top:max(env(safe-area-inset-top),14px)}
  .shell{padding:0}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  .map-panel{display:none}
}

/* ===== Layout primitives ===== */
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:5}
.layer.over{z-index:20;animation:slideIn .22s ease-out}
@keyframes slideIn{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.pad{padding:0 18px}
.top{padding-top:var(--top)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}

/* ===== Type ===== */
.display{font-family:var(--font-d);font-weight:800;letter-spacing:-.02em;line-height:1.02}
.h1{font-family:var(--font-d);font-weight:700;font-size:28px;letter-spacing:-.015em;line-height:1.1}
.h2{font-family:var(--font-d);font-weight:700;font-size:19px;letter-spacing:-.01em}
.h3{font-weight:600;font-size:16px}
.body{font-size:15px;line-height:1.5;color:#e6e6e6}
.small{font-size:13px;color:var(--muted);line-height:1.4}
.tiny{font-size:11.5px;color:var(--dim)}
.sample{font-size:11px;color:var(--warn);font-weight:500}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== Controls ===== */
.btn{min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:#fff}
.btn-red:active{background:var(--red-press)}
.btn-white{background:#fff;color:#000}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff}
.btn-line{border:1px solid #444;color:#fff}
.btn[disabled]{background:#2a2a2a;color:#777;cursor:not-allowed}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:0 14px;font-size:13.5px}
.icon-btn{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn.glass{background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 15px;border-radius:999px;border:1px solid #3a3a3a;font-size:14px;font-weight:500;color:#ddd;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}
.chip.red[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.field{display:block}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.input{width:100%;min-height:48px;padding:12px 14px;background:var(--raise);border:1px solid #2e2e2e;border-radius:var(--r-m);outline:none}
.input:focus{border-color:#fff}
textarea.input{min-height:96px;resize:vertical}
.err{color:#ff6b6b;font-size:12.5px;margin-top:6px}
.toggle{width:50px;height:30px;border-radius:999px;background:#3a3a3a;position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-checked=true]{background:var(--red)}
.toggle[aria-checked=true]::after{transform:translateX(20px)}
.seg{display:flex;background:var(--raise);border-radius:999px;padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;min-height:36px;padding:0 12px;border-radius:999px;font-size:13.5px;color:var(--muted);font-weight:600}
.seg button[aria-pressed=true]{background:#fff;color:#000}

/* ===== Surfaces ===== */
.card{background:var(--surface);border-radius:var(--r-m);overflow:hidden}
.panel{background:var(--surface);border-radius:var(--r-m);padding:16px}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:56px}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.14)}
.badge.red{background:var(--red)}
.badge.ok{background:rgba(70,211,154,.16);color:var(--ok)}
.badge.warn{background:rgba(245,184,74,.16);color:var(--warn)}
.live-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.bar{height:6px;background:#2a2a2a;border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--red);border-radius:9px}
.art{position:relative;overflow:hidden;background:#111}
.art>svg,.art>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,8,0) 35%,rgba(8,8,8,.92) 100%);pointer-events:none}
.rail{display:flex;gap:10px;overflow-x:auto;padding:0 18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail>*{scroll-snap-align:start;flex:none}
.skel{background:linear-gradient(90deg,#161616,#222,#161616);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r-m)}
@keyframes grow{from{width:0}to{width:100%}}
@keyframes sh{to{background-position:-200% 0}}
.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.ring{padding:3px;border-radius:50%;background:var(--red)}
.ring.seen{background:#3a3a3a}
.ring>div{border:3px solid var(--bg);border-radius:50%}

/* ===== Tab bar ===== */
.tabbar{display:flex;height:80px;padding-bottom:16px;background:rgba(8,8,8,.97);border-top:1px solid var(--line);flex:none;position:relative;z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--dim)}
.tab[aria-current=page]{color:#fff}
.tab .pip{width:4px;height:4px;border-radius:50%;background:transparent}
.tab[aria-current=page] .pip{background:var(--red)}

/* ===== Sheet / dialog / toast ===== */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;animation:fade .15s}
.scrim.center{align-items:center;justify-content:center;padding:24px}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:82%;background:#151515;border-radius:24px 24px 0 0;padding:10px 18px 28px;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px)}}
.grab{width:40px;height:5px;border-radius:9px;background:#3a3a3a;margin:0 auto 12px}
.dialog{background:#1a1a1a;border-radius:20px;padding:22px;width:100%}
.toast{position:absolute;left:18px;right:18px;bottom:96px;z-index:80;background:#fff;color:#000;border-radius:14px;padding:13px 16px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .2s}

/* ===== Reels ===== */
.reel{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
.stamp{position:absolute;top:120px;padding:6px 14px;border:3px solid;border-radius:10px;font-family:var(--font-d);font-weight:800;font-size:26px;transform:rotate(-10deg);pointer-events:none}

/* ===== Chat ===== */
.msg{max-width:78%;padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.4}
.msg.me{background:var(--red);margin-left:auto;border-bottom-right-radius:6px}
.msg.them{background:#1f1f1f;border-bottom-left-radius:6px}
.msg.ann{background:#1a1212;border:1px solid #4a1a1d;max-width:100%}
</style>

/* =========================================================
   Generated Himalayan scene art (placeholder for real photography)
   ========================================================= */
const PALETTES = {
  ember: ['#1a0707', '#8a2a14', '#6a3a2c', '#3a1a14', '#0c0606', '#ffb24a'],
  forest: ['#07140d', '#3c6e4c', '#86ab8f', '#2c4a35', '#08120b', '#f3e6b0'],
  dusk: ['#0a0c22', '#4a3f86', '#7a6aa8', '#2c2a58', '#0a0a18', '#ffc6d6'],
  clay: ['#170c06', '#b0603a', '#cf9264', '#713c20', '#22120a', '#ffe0b0'],
  mist: ['#0b161c', '#5f8796', '#a9c2c8', '#4a6670', '#10191d', '#eef6f6'],
  snow: ['#07122a', '#3d6eaa', '#eef3fa', '#7d97ba', '#141e30', '#ffffff'],
  tea: ['#0c180e', '#86ae66', '#c2dba2', '#4c773c', '#11200e', '#fff3c4'],
  river: ['#051318', '#2c6f80', '#86c2cc', '#2e5560', '#08191e', '#d8f3ff'],
  dawn: ['#180c26', '#c65a4a', '#7a4f74', '#3a2846', '#110b18', '#ffd27a'],
};
const FLAG = ['#2b6cb0', '#f2f2f2', '#c53030', '#2f855a', '#d69e2e'];
function Art({ pal = 'mist', seed = 1, flags = true, label, img, style, className = '', children, shade = true }) {
  const p = PALETTES[pal] || PALETTES.mist;
  const scene = useMemo(() => {
    const r = rng(seed);
    const ridge = (base, amp, n) => {
      let d = `M0 ${base}`; const st = 400 / n;
      for (let i = 0; i < n; i++) {
        const x = i * st;
        d += ` L${x + st * (0.3 + r() * 0.4)} ${base - amp * (0.45 + r() * 0.55)} L${x + st} ${base - amp * r() * 0.25}`;
      }
      return d + ' L400 300 L0 300 Z';
    };
    const fy1 = 60 + r() * 50, fy2 = 50 + r() * 60;
    const flagsArr = [];
    for (let i = 1; i < 14; i++) {
      const t = i / 14, x = 20 + 360 * t;
      const y = (1 - t) * (1 - t) * fy1 + 2 * (1 - t) * t * (fy1 + 40) + t * t * fy2;
      flagsArr.push({ x, y, c: FLAG[i % 5] });
    }
    return { far: ridge(170, 110, 3), mid: ridge(215, 80, 4), near: ridge(260, 60, 5), sun: { x: 60 + r() * 280, y: 70 + r() * 40 }, fy1, fy2, flags: flagsArr };
  }, [pal, seed]);
  const gid = `sky-${pal}-${seed}`;
  return (
    <div className={`art ${shade ? 'shade' : ''} ${className}`} style={style} role={label ? 'img' : undefined} aria-label={label}>
      {img ? <img src={img} alt="" /> : (
        <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={p[0]} /><stop offset="1" stopColor={p[1]} /></linearGradient></defs>
          <rect width="400" height="300" fill={`url(#${gid})`} />
          <circle cx={scene.sun.x} cy={scene.sun.y} r="26" fill={p[5]} opacity=".85" />
          <path d={scene.far} fill={p[2]} opacity=".9" />
          <path d={scene.mid} fill={p[3]} />
          {flags && <>
            <path d={`M20 ${scene.fy1} Q200 ${scene.fy1 + 80} 380 ${scene.fy2}`} stroke="#ddd" strokeWidth=".8" fill="none" opacity=".6" />
            {scene.flags.map((f, i) => <rect key={i} x={f.x - 5} y={f.y} width="10" height="13" fill={f.c} opacity=".9" transform={`rotate(${(i % 3) * 4 - 4} ${f.x} ${f.y})`} />)}
          </>}
          <path d={scene.near} fill={p[4]} />
        </svg>
      )}
      {children}
    </div>
  );
}

  return <div className="chips" role="group" aria-label={label}>{items.map((i) => <button key={i} className={`chip ${red ? 'red' : ''}`} aria-pressed={on(i)} onClick={() => click(i)}>{i}</button>)}</div>;

const HERO = ['e1', 'e2', 'e5'];
function Home() {
  const { S, push } = useApp();
  const [cat, setCat] = useState('All');
  const [loading, setLoading] = useState(true);
  const [slide, setSlide] = useState(0);
  const heroRef = useRef(null);
  useEffect(() => { const t = setTimeout(() => setLoading(false), 650); return () => clearTimeout(t); }, []);
  const f = (e) => cat === 'All' || e.cats.includes(cat);
  const unread = S.notifs.filter((n) => !n.read).length;
  const rails = [
    ['Popular experiences', EXPS.filter((e) => e.popular)],
    ['Curated for you', EXPS.filter((e) => e.cats.some((c) => S.interests.includes(c)) || S.interests.includes(e.cats[0]))],
    ['Near you in Gangtok', EXPS.filter((e) => e.region === 'Gangtok')],
    ['This weekend', EXPS.filter((e) => S.seats[e.id][0] + S.seats[e.id][1] > 0)],

    ['Nature and wildlife', EXPS.filter((e) => e.cats.includes('Nature'))],

    <div className="scroll">

        <div className="row between pad top" style={{ position: 'absolute', zIndex: 3, left: 0, right: 0, paddingBottom: 8 }}>

        {loading ? <div className="skel" style={{ height: 540, borderRadius: 0 }} /> : heroes.length === 0 ? <div style={{ height: 300 }} /> : (
          <div ref={heroRef} onScroll={onHeroScroll} className="rail" style={{ padding: 0, gap: 0 }} aria-roledescription="carousel" aria-label="Featured experiences">
            {heroes.map((e, i) => (
              <Art key={e.id} pal={e.pal} seed={e.seed} label={`${e.title}, illustrative scene`} style={{ width: '100%', minWidth: '100%', height: 540 }}>
                <div style={{ position: 'absolute', left: 18, right: 18, bottom: 34, zIndex: 2 }} aria-hidden={i !== slide}>
                  <div className="badge" style={{ marginBottom: 12 }}>{e.area}, {e.dur}</div>
                  <div className="display" style={{ fontSize: 40, maxWidth: 320 }}>{e.title}</div>
                  <p className="body" style={{ marginTop: 10, color: '#ddd', maxWidth: 330 }}>{e.teaser}</p>
                  <div className="row" style={{ marginTop: 18 }}>
                    <button className="btn btn-white" onClick={() => push('exp', { id: e.id })} tabIndex={i === slide ? 0 : -1}>Explore</button>
                    <button className="btn btn-red" onClick={() => push('book', { id: e.id })} tabIndex={i === slide ? 0 : -1}>Book now</button>
                    <div className="grow" />
                    <SaveBtn id={e.id} />
                  </div>
                </div>
              </Art>
            ))}
          </div>
        )}
        {!loading && heroes.length > 1 && (
          <div className="row" style={{ justifyContent: 'center', gap: 6, marginTop: -16, position: 'relative', zIndex: 3 }}>
            {heroes.map((_, i) => <button key={i} onClick={() => goSlide(i)} aria-label={`Show slide ${i + 1}`} aria-current={i === slide} style={{ width: i === slide ? 20 : 7, height: 7, borderRadius: 7, background: i === slide ? 'var(--red)' : '#555', transition: 'width .2s', padding: 0 }} />)}
          </div>
        )}
      </div>

      {loading ? (
        [0, 1].map((k) => <div key={k} style={{ marginTop: 28 }}><div className="skel" style={{ width: 160, height: 18, margin: '0 18px 12px' }} /><div className="rail">{[0, 1, 2].map((j) => <div key={j} className="skel" style={{ width: 138, height: 196 }} />)}</div></div>)

        <Empty title={`No ${cat.toLowerCase()} experiences yet`} body="Hosts are adding new experiences every week. Try another category." cta="Show all" onCta={() => setCat('All')} />
      ) : rails.map(([t, l]) => (
        <Section key={t} title={t}><div className="rail">{l.map((e) => <ExpCard key={e.id} e={e} />)}</div></Section>
      ))}
      <p className="tiny pad" style={{ margin: '30px 0 24px' }}>Prices, ratings, hosts and availability shown are sample data for this prototype. Not an official tourism service.</p>
    </div>
  );
}

  const { S } = useApp();
  const touched = q || cat !== 'All' || region !== 'Anywhere' || maxP < 3000 || date !== 'Any date';
  const res = EXPS.filter((e) =>
    (!q || (e.title + e.area + e.cats.join(' ') + HOSTS[e.host].name).toLowerCase().includes(q.toLowerCase())) &&
    (cat === 'All' || e.cats.includes(cat)) && (region === 'Anywhere' || e.region === region) && e.price <= maxP &&
    (date === 'Any date' || S.seats[e.id][DATES.indexOf(date)] > 0));
  const clear = () => { setQ(''); setCat('All'); setRegion('Anywhere'); setMaxP(3000); setDate('Any date'); };
  return (

/* =========================================================
   EXPLORE REELS (Prompt 03)
   ========================================================= */
function Explore() {
  const { S, push, toggleSave, upd, say, stackLen } = useApp();
  const deck = EXPS;
  const [i, setI] = useState(0);
  const [drag, setDrag] = useState({ x: 0, y: 0, on: false });
  const [fly, setFly] = useState(null);
  const [muted, setMuted] = useState(true);
  const [cc, setCc] = useState(true);
  const start = useRef(null);
  const e = deck[i % deck.length];
  const next = deck[(i + 1) % deck.length];
  const liked = S.liked.includes(e.id);

  const decide = (dir) => {
    if (fly) return;
    if (dir === 'right') { if (!S.saved.includes(e.id)) toggleSave(e.id, true); say(`Saved "${e.title}" to your interested list`); }
    if (dir === 'left') upd((s) => ({ skipped: [...s.skipped, e.id] }));
    setFly(dir);
    setTimeout(() => { setI((v) => v + 1); setFly(null); setDrag({ x: 0, y: 0, on: false }); }, 230);
  };
  const down = (ev) => { start.current = { x: ev.clientX, y: ev.clientY }; ev.currentTarget.setPointerCapture(ev.pointerId); setDrag({ x: 0, y: 0, on: true }); };
  const move = (ev) => { if (!start.current) return; setDrag({ x: ev.clientX - start.current.x, y: ev.clientY - start.current.y, on: true }); };
  const up = () => {
    if (!start.current) return; start.current = null;
    const { x, y } = drag;
    // Gesture arbitration: the dominant axis wins, so a diagonal flick never triggers two actions.
    if (Math.abs(x) < 8 && Math.abs(y) < 8) { setDrag({ x: 0, y: 0, on: false }); push('exp', { id: e.id }); return; }
    if (Math.abs(x) > Math.abs(y) && Math.abs(x) > 90) return decide(x > 0 ? 'right' : 'left');
    if (Math.abs(y) > Math.abs(x) && y < -90) return decide('up');
    setDrag({ x: 0, y: 0, on: false });
  };
  useEffect(() => {
    const k = (ev) => { if (stackLen || ev.target.tagName === 'INPUT') return; if (ev.key === 'ArrowRight') decide('right'); if (ev.key === 'ArrowLeft') decide('left'); if (ev.key === 'ArrowUp') decide('up'); };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  });
  const tx = fly === 'right' ? 500 : fly === 'left' ? -500 : drag.x;
  const ty = fly === 'up' ? -900 : drag.y < 0 && Math.abs(drag.y) > Math.abs(drag.x) ? drag.y : drag.y * 0.2;
  const rot = fly === 'up' ? 0 : tx / 22;
  const h = HOSTS[e.host];

  return (
    <div style={{ position: 'relative', flex: 1, overflow: 'hidden', background: '#000' }}>
      {/* Preloaded next reel sits underneath */}
      <Art pal={next.pal} seed={next.seed} style={{ position: 'absolute', inset: 0, transform: 'scale(.94)', opacity: .5 }} />
      <div className="reel" onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
        style={{ transform: `translate(${tx}px,${ty}px) rotate(${rot}deg)`, transition: drag.on && !fly ? 'none' : 'transform .23s ease-out' }}
        aria-label={`${e.title}. Tap for details, swipe right to save, left to skip, up for next.`}>
        <Art pal={e.pal} seed={e.seed} style={{ position: 'absolute', inset: 0 }} label={`${e.title} reel, illustrative`} />
        {drag.x > 40 && <div className="stamp" style={{ left: 24, color: 'var(--ok)', borderColor: 'var(--ok)' }}>Interested</div>}
        {drag.x < -40 && <div className="stamp" style={{ right: 24, color: '#ff6b6b', borderColor: '#ff6b6b', transform: 'rotate(10deg)' }}>Skip</div>}
      </div>

      <div className="row between pad top" style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 4, pointerEvents: 'none' }}>
        <div className="h2">Explore</div>
        <div className="row" style={{ gap: 4, pointerEvents: 'auto' }}>
          <button className="icon-btn glass" onClick={() => setCc(!cc)} aria-pressed={cc} aria-label="Captions"><Icon n="cc" s={20} style={{ opacity: cc ? 1 : .5 }} /></button>
          <button className="icon-btn glass" onClick={() => setMuted(!muted)} aria-label={muted ? 'Unmute' : 'Mute'}><Icon n={muted ? 'mute' : 'volume'} s={20} /></button>
        </div>
      </div>

      <div style={{ position: 'absolute', right: 10, bottom: 210, zIndex: 4, display: 'flex', flexDirection: 'column', gap: 14, alignItems: 'center' }}>
        <button className="icon-btn glass" style={{ color: liked ? 'var(--red)' : '#fff' }} onClick={() => upd((s) => ({ liked: liked ? s.liked.filter((x) => x !== e.id) : [...s.liked, e.id] }))} aria-pressed={liked} aria-label="Like"><Icon n="heart" fill={liked} /></button>
        <SaveBtn id={e.id} />
        <button className="icon-btn glass" onClick={() => say('Share sheet would open here (mock)')} aria-label="Share"><Icon n="share" /></button>
      </div>

      <div className="pad" style={{ position: 'absolute', left: 0, right: 60, bottom: 92, zIndex: 4, pointerEvents: 'none' }}>
        <div className="row" style={{ gap: 8 }}><Avatar name={h.name} size={30} /><span style={{ fontWeight: 600, fontSize: 14 }}>{h.name}</span></div>
        <div className="display" style={{ fontSize: 30, marginTop: 10 }}>{e.title}</div>
        <div className="row" style={{ gap: 6, marginTop: 8, flexWrap: 'wrap' }}>{e.cats.map((c) => <span key={c} className="badge">{c}</span>)}<span className="badge">{e.area}</span><span className="badge">{e.dur}</span></div>
        <div style={{ marginTop: 8, fontWeight: 600 }}>From {inr(e.price)} <span className="sample">sample price</span></div>
        {cc && <div style={{ marginTop: 10, background: 'rgba(0,0,0,.65)', padding: '6px 10px', borderRadius: 8, fontSize: 13.5, display: 'inline-block' }}>{e.caption}</div>}
      </div>

      <div className="row pad" style={{ position: 'absolute', left: 0, right: 0, bottom: 22, zIndex: 4, gap: 10 }}>
        <button className="icon-btn glass" style={{ width: 48, height: 48 }} onClick={() => decide('left')} aria-label="Skip"><Icon n="x" /></button>
        <button className="btn btn-white grow" style={{ padding: '0 10px', whiteSpace: 'nowrap' }} onClick={() => push('exp', { id: e.id })}>View experience</button>
        <button className="icon-btn glass" style={{ width: 48, height: 48 }} onClick={() => decide('up')} aria-label="Next reel"><Icon n="up" /></button>
        <button className="icon-btn" style={{ width: 48, height: 48, background: 'var(--red)' }} onClick={() => decide('right')} aria-label="Interested"><Icon n="heart" fill /></button>
      </div>
    </div>
  );
}

/* =========================================================
   BOOKING: date + guests -> checkout -> result -> ticket (Prompt 04)
   ========================================================= */
const FEE = 0.05;
function priceOf(e, qty) { const base = e.price * qty; const fee = Math.round(base * FEE); return { base, fee, total: base + fee }; }
function Booking({ id = 'e1' }) {
  const { S, push, pop } = useApp();
  const e = EXP[id];
  const seats = S.seats[id];
  const first = seats.findIndex((x) => x > 0);
  const [d, setD] = useState(first);
  const [qty, setQty] = useState(1);
  const left = d >= 0 ? seats[d] : 0;
  useEffect(() => { if (qty > left && left > 0) setQty(left); }, [d]);
  const pr = priceOf(e, qty);
  return (
    <>
      <Header title="Choose date and guests" sub={e.title} />
      <div className="scroll pad">
        {first < 0 ? <Empty icon="cal" title="All sample dates are sold out" body="Seats sometimes open up after cancellations." cta="Back to details" onCta={pop} /> : <>
          <div className="h3" style={{ marginTop: 8 }}>Date</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 10 }}>
            {DATES.map((dt, k) => (
              <button key={dt} disabled={!seats[k]} onClick={() => setD(k)} aria-pressed={d === k}
                style={{ padding: 14, borderRadius: 14, textAlign: 'left', border: d === k ? '2px solid var(--red)' : '1px solid #333', background: d === k ? 'rgba(229,9,20,.1)' : 'var(--surface)', opacity: seats[k] ? 1 : .45, minHeight: 64 }}>
                <div style={{ fontWeight: 600 }}>{dt}</div>
                <div className="tiny" style={{ color: seats[k] ? (seats[k] <= 3 ? 'var(--warn)' : 'var(--muted)') : '#ff6b6b' }}>{seats[k] ? `${e.time}, ${seats[k]} seats left` : 'Sold out'}</div>
              </button>
            ))}
          </div>
          <div className="row between" style={{ marginTop: 24 }}>
            <div><div className="h3">Participants</div><div className="tiny">Max {left} for this date</div></div>
            <Stepper value={qty} max={Math.max(1, left)} onChange={setQty} label="participants" />
          </div>
          <div className="panel" style={{ marginTop: 24 }}>
            <div className="row between small"><span>{inr(e.price)} x {qty}</span><span style={{ color: '#fff' }}>{inr(pr.base)}</span></div>
            <div className="row between small" style={{ marginTop: 8 }}><span>Platform fee (5%, illustrative)</span><span style={{ color: '#fff' }}>{inr(pr.fee)}</span></div>
            <div className="row between" style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--line)', fontWeight: 700 }}><span>Total</span><span>{inr(pr.total)}</span></div>
          </div>
          <p className="tiny" style={{ marginTop: 10 }}>Taxes, if any, would be shown here once confirmed with the operator.</p>
        </>}
      </div>
      {first >= 0 && <div className="pad" style={{ padding: '12px 18px 26px' }}><button className="btn btn-red btn-block" onClick={() => push('checkout', { id, d, qty })}>Continue to checkout, {inr(pr.total)}</button></div>}
    </>
  );
}
function Checkout({ id = 'e1', d = 0, qty = 1 }) {
  const { S, replace, book } = useApp();
  const e = EXP[id];
  const pr = priceOf(e, qty);
  const [name, setName] = useState(S.user.name === 'Guest' ? '' : S.user.name);
  const [contact, setContact] = useState(S.user.contact);
  const [method, setMethod] = useState('UPI');
  const [fail, setFail] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState({});
  const pay = () => {
    const er = {};
    if (name.trim().length < 2) er.name = 'Enter the lead traveller\u2019s name.';
    if (!/^(\+?\d[\d\s]{8,}|\S+@\S+\.\S+)$/.test(contact.trim())) er.contact = 'Enter a phone number or email for the ticket.';
    setErr(er); if (Object.keys(er).length) return;
    if (S.seats[id][d] < qty) { replace('result', { ok: false, reason: 'soldout', id }); return; }
    setBusy(true);
    setTimeout(() => {
      setBusy(false);
      if (fail) replace('result', { ok: false, id, d, qty });
      else { const b = book({ expId: id, d, qty, total: pr.total, name, method }); replace('result', { ok: true, bookingId: b.id }); }
    }, 1100);
  };
  return (
    <>
      <Header title="Checkout" sub="Mock payment, no money moves" />
      <div className="scroll pad stack">
        <div className="panel row"><Art pal={e.pal} seed={e.seed} shade={false} flags={false} style={{ width: 56, height: 56, borderRadius: 10, flex: 'none' }} /><div><div className="h3">{e.title}</div><div className="small">{DATES[d]}, {e.time}, {qty} guest{qty > 1 ? 's' : ''}</div></div></div>
        <label className="field"><span>Lead traveller name</span><input className="input" value={name} onChange={(x) => setName(x.target.value)} autoComplete="name" />{err.name && <div className="err">{err.name}</div>}</label>
        <label className="field"><span>Phone or email for your ticket</span><input className="input" value={contact} onChange={(x) => setContact(x.target.value)} placeholder="+91 98xxx xxxxx" />{err.contact && <div className="err">{err.contact}</div>}</label>
        <div className="field"><span className="small">Payment method (mock)</span>
          <div className="stack" style={{ marginTop: 6 }} role="radiogroup" aria-label="Payment method">
            {['UPI', 'Card', 'Pay at meeting point'].map((m) => <button key={m} role="radio" aria-checked={method === m} onClick={() => setMethod(m)} className="row panel" style={{ width: '100%', padding: 14, border: method === m ? '2px solid #fff' : '2px solid transparent' }}><span style={{ width: 20, height: 20, borderRadius: 20, border: '2px solid #fff', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{method === m && <span style={{ width: 10, height: 10, borderRadius: 10, background: '#fff' }} />}</span>{m}</button>)}
          </div>
        </div>
        <label className="row between panel"><span className="small">Simulate a failed payment (for testing)</span><Toggle on={fail} onChange={setFail} label="Simulate failed payment" /></label>
        <div className="row between" style={{ fontWeight: 700, fontSize: 17, padding: '6px 0' }}><span>Total</span><span>{inr(pr.total)}</span></div>
      </div>
      <div style={{ padding: '12px 18px 26px' }}><button className="btn btn-red btn-block" onClick={pay} disabled={busy}>{busy ? 'Processing\u2026' : `Pay ${inr(pr.total)}`}</button></div>
    </>
  );
}
function Result({ ok, bookingId, id, d, qty, reason }) {
  const { S, replace, pop, resetTo, only } = useApp();
  const b = S.bookings.find((x) => x.id === bookingId);
  if (ok && !b) return null;
  return (
    <div className="scroll pad" style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center', textAlign: 'center' }}>
      <div style={{ width: 84, height: 84, borderRadius: 84, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'center', background: ok ? 'rgba(70,211,154,.14)' : 'rgba(229,9,20,.15)', color: ok ? 'var(--ok)' : 'var(--red)' }}><Icon n={ok ? 'check' : 'x'} s={40} sw={2.6} /></div>
      {ok ? <>
        <h1 className="h1" style={{ marginTop: 20 }}>Booking confirmed</h1>
        <p className="body" style={{ marginTop: 8 }}>{EXP[b.expId].title}<br />{DATES[b.d]}, {b.qty} guest{b.qty > 1 ? 's' : ''}</p>

  const fmtDate = (d) => new Date(d + 'T00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const fmtT = (t) => { const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}${m ? ':' + String(m).padStart(2, '0') : ''} ${h < 12 ? 'AM' : 'PM'}`; };
  const preview = { id: 'preview', title: v.title || 'Untitled', host: 'h4', area: v.area, date: fmtDate(v.date), time: `${fmtT(v.time)}\u2013${fmtT(v.end)}`, price: v.paid ? +v.price : 0, capacity: v.capacity, kind, approval: v.approval, tags: v.tags, pal: v.pal, seed: 77, img: v.img, attendees: [], waitlist: [], mine: true };
  const steps = ['Details', 'When and where', 'Group and price', 'Preview'];
  return (
    <>
      <Header title="Create an experience" sub={`Step ${step + 1} of 4: ${steps[step]}`} onBack={step ? () => setStep(step - 1) : pop} />
      <div className="row pad" style={{ gap: 6, marginBottom: 6 }}>{steps.map((_, k) => <div key={k} className="grow" style={{ height: 4, borderRadius: 4, background: k <= step ? 'var(--red)' : '#2a2a2a' }} />)}</div>

            </div>

          <div className="field"><span className="small">Tags</span><div style={{ margin: '6px -18px 0' }}><Chips items={['Food', 'Art', 'Nature', 'Music', 'Wellness', 'Culture']} value={v.tags} onChange={s('tags')} multi label="Tags" /></div>{err.tags && <div className="err">{err.tags}</div>}</div>
        </>}
        {step === 1 && <>
          <label className="field"><span>Date</span><input type="date" className="input" value={v.date} min="2026-11-01" onChange={s('date')} style={{ colorScheme: 'dark' }} />{err.date && <div className="err">{err.date}</div>}</label>
          <div className="row"><label className="field grow"><span>Starts</span><input type="time" className="input" value={v.time} onChange={s('time')} style={{ colorScheme: 'dark' }} /></label><label className="field grow"><span>Ends</span><input type="time" className="input" value={v.end} onChange={s('end')} style={{ colorScheme: 'dark' }} /></label></div>
          {err.time && <div className="err">{err.time}</div>}
          <label className="field"><span>Area</span><select className="input" value={v.area} onChange={s('area')}><option value="">Choose an area</option>{['Gangtok', 'Aritar', 'Pelling', 'Yuksom', 'Ravangla', 'Namchi', 'Temi'].map((a) => <option key={a}>{a}</option>)}</select>{err.area && <div className="err">{err.area}</div>}</label>
          <label className="field"><span>Public meeting point</span><input className="input" value={v.meet} onChange={s('meet')} placeholder="e.g. Clock tower, MG Marg" />{err.meet && <div className="err">{err.meet}</div>}</label>
          <div className="panel" style={{ height: 120, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 6, border: '1px dashed #333' }}><Icon n="pin" s={26} /><span className="tiny">Map pin placeholder. A real map SDK would go here.</span></div>
          <p className="tiny">Avoid private homes as meeting points for first meetings. Some areas of Sikkim need permits; mention this in the description if it applies.</p>
        </>}
        {step === 2 && <>
          <div className="row between"><div><div className="h3">Maximum participants</div><div className="tiny">Small groups work best. Default is 10.</div></div><Stepper value={v.capacity} min={2} max={30} onChange={s('capacity')} label="participants" /></div>
          {err.capacity && <div className="err">{err.capacity}</div>}
          <div className="seg" role="group" aria-label="Pricing"><button aria-pressed={!v.paid} onClick={() => setV({ ...v, paid: false })}>Free casual meetup</button><button aria-pressed={v.paid} onClick={() => setV({ ...v, paid: true })}>Paid hosted session</button></div>
          {v.paid ? <>
            <label className="field"><span>Price per person (INR)</span><input type="number" inputMode="numeric" className="input" value={v.price} onChange={(x) => setV({ ...v, price: +x.target.value })} />{err.price && <div className="err">{err.price}</div>}</label>
            <div className="panel small" style={{ border: '1px solid #4a3a1a' }}><b style={{ color: 'var(--warn)' }}>Paid sessions are reviewed before listing.</b> Our team checks the description, price and safety notes. Hosts collecting money must complete identity verification before payouts.</div>
          </> : <div className="panel small">Free meetups publish right away. Anyone can report a meetup, and reports are reviewed by moderators.</div>}
          <label className="field"><span>What to bring or know (optional)</span><input className="input" value={v.reqs} onChange={s('reqs')} placeholder="Warm layer, comfortable shoes" /></label>
          <div className="field"><span className="small">Who can join</span>
            <div className="seg" style={{ marginTop: 6 }} role="group" aria-label="Approval"><button aria-pressed={v.approval === 'instant'} onClick={() => setV({ ...v, approval: 'instant' })}>Anyone, instantly</button><button aria-pressed={v.approval === 'request'} onClick={() => setV({ ...v, approval: 'request' })}>I approve each request</button></div>
          </div>
        </>}
        {step === 3 && <>
          <p className="small">This is how your event will appear in Community.</p>
          <div style={{ pointerEvents: 'none' }}><EventCard ev={preview} /></div>
          <div className="panel small" style={{ lineHeight: 1.6 }}>
            <div>{preview.date}, {preview.time}, {v.area}</div><div>Meet at {v.meet}</div><div>{v.capacity} places, {v.approval === 'instant' ? 'instant join' : 'you approve requests'}</div><div>{v.paid ? `${inr(+v.price)} per person, goes to review first` : 'Free, publishes immediately'}</div>
          </div>
        </>}
      </div>
      <div style={{ padding: '12px 18px 26px' }}>
        {step < 3 ? <button className="btn btn-red btn-block" onClick={nextStep}>Continue</button> : <button className="btn btn-red btn-block" onClick={publish}>{v.paid ? 'Submit for review' : 'Publish'}</button>}
      </div>
    </>
  );
}

  const remove = (name) => set((e) => {
    const at = e.attendees.filter((a) => a !== name);

      <Header title="Manage event" sub={ev.status === 'review' ? 'In review' : ev.status === 'cancelled' ? 'Cancelled' : 'Published'} right={ev.status !== 'cancelled' && <button className="icon-btn" onClick={() => setEdit(true)} aria-label="Edit event"><Icon n="edit" s={20} /></button>} />

          <div style={{ padding: 14 }} className="small">{ev.date}, {ev.time}, {ev.area}<div className="row" style={{ marginTop: 8, gap: 8 }}><div className="bar grow"><i style={{ width: `${n / ev.capacity * 100}%` }} /></div><span>{n}/{ev.capacity}</span></div></div>
        </div>

        </div>

          <div className="pad">
            {ev.requests.length === 0 && <p className="small">No pending requests.</p>}
            {ev.requests.map((r) => <div key={r} className="list-row"><Avatar name={r} size={36} /><span className="grow">{r}</span><button className="btn btn-sm btn-ghost" onClick={() => set((e) => ({ requests: e.requests.filter((x) => x !== r) }))}>Decline</button><button className="btn btn-sm btn-white" onClick={() => approve(r)}>Approve</button></div>)}
            <button className="small" style={{ marginTop: 8, minHeight: 36, color: '#fff' }} onClick={() => set((e) => ({ requests: [...e.requests, ['Rohan', 'Mei', 'Asha', 'Pablo', 'Leela'][e.requests.length % 5]] }))}>+ Simulate an incoming request</button>
          </div>
        </Section>}
        <Section title={`Attendees (${ev.attendees.length})`} style={{ margin: '22px -18px 0' }}>
          <div className="pad">
            {ev.attendees.length === 0 && <p className="small">No one has joined yet. Share your event to get started.</p>}
            {ev.attendees.map((a) => <div key={a} className="list-row"><Avatar name={a} size={36} /><span className="grow">{a}</span><button className="icon-btn" aria-label={`Report ${a}`} onClick={() => setRepWho(a)}><Icon n="flag" s={18} /></button><button className="icon-btn" aria-label={`Remove ${a}`} onClick={() => remove(a)}><Icon n="x" s={18} /></button></div>)}
            <button className="small" style={{ marginTop: 8, minHeight: 36, color: '#fff' }} onClick={() => set((e) => (evCount(e) >= e.capacity ? { waitlist: [...e.waitlist, `Guest ${e.waitlist.length + 1}`] } : { attendees: [...e.attendees, `Guest ${e.attendees.length + 1}`] }))}>+ Simulate someone joining</button>
          </div>
        </Section>
        <Section title={`Waitlist (${ev.waitlist.length})`} style={{ margin: '22px -18px 0' }}>
          <div className="pad">{ev.waitlist.length ? ev.waitlist.map((w, k) => <div key={w} className="list-row"><span className="tiny" style={{ width: 18 }}>{k + 1}</span><Avatar name={w} size={32} /><span className="grow">{w}</span></div>) : <p className="small">Nobody waiting. When the event is full, new people join a waitlist automatically.</p>}</div>
        </Section>
        <label className="row between panel" style={{ marginTop: 22 }}><span className="small">Notify me when people join or leave</span><Toggle on={!S.muted.includes('host-' + ev.id)} onChange={(on) => upd((s) => ({ muted: on ? s.muted.filter((m) => m !== 'host-' + ev.id) : [...s.muted, 'host-' + ev.id] }))} label="Join notifications" /></label>
        {ev.status !== 'cancelled' && <button className="btn btn-line btn-block" style={{ margin: '22px 0 30px', color: '#ff6b6b', borderColor: '#5a2020' }} onClick={() => setCancel(true)}>Cancel event</button>}

    </>
  );

/* =========================================================
   GROUP CHAT (Prompt 08)
   ========================================================= */
function Chat({ id = 'c1' }) {
  const { S, upd, say, report } = useApp();
  const ev = S.events.find((e) => e.id === id) || S.events[0];
  const msgs = S.chats[ev.id] || [];
  const [t, setT] = useState('');
  const [people, setPeople] = useState(false);
  const [menu, setMenu] = useState(null);
  const [rep, setRep] = useState(null);
  const endRef = useRef(null);
  const hostName = ev.mine ? S.user.name : HOSTS[ev.host].name;
  const allowed = ev.mine || ev.me === 'joined';
  const muted = S.muted.includes(ev.id);
  useEffect(() => { endRef.current?.scrollIntoView({ block: 'end' }); }, [msgs.length]);
  const add = (m) => upd((s) => ({ chats: { ...s.chats, [ev.id]: [...(s.chats[ev.id] || []), { id: Date.now() + Math.random(), ...m }] } }));
  const send = (media) => {
    if (!media && !t.trim()) return;
    add({ from: 'me', text: media ? '' : t.trim(), media, host: ev.mine, ann: ev.mine && t.startsWith('!') });
    setT('');
    if (!ev.mine) setTimeout(() => add({ from: hostName, host: true, text: media ? 'Lovely photo!' : 'Noted, see you there.' }), 1400);
  };
  if (!allowed) return <><Header title={ev.title} /><Empty icon="lock" title="Chat opens after you join" body="Only confirmed participants and the host can read and post in this group." /></>;
  return (
    <>
      <Header title={ev.title} sub={`${evCount(ev) + (ev.mine ? 0 : 1)} people`} right={<div className="row" style={{ gap: 0 }}>
        <button className="icon-btn" onClick={() => setPeople(true)} aria-label="Participants"><Icon n="users" s={20} /></button>
        <button className="icon-btn" onClick={() => upd((s) => ({ muted: muted ? s.muted.filter((m) => m !== ev.id) : [...s.muted, ev.id] }))} aria-label={muted ? 'Unmute notifications' : 'Mute notifications'} aria-pressed={muted}><Icon n={muted ? 'mute' : 'bell'} s={20} /></button>
      </div>} />
      <div className="row pad" style={{ gap: 10, padding: '10px 18px', background: '#141414', borderTop: '1px solid var(--line)', borderBottom: '1px solid var(--line)' }}>
        <Icon n="pin" s={18} style={{ color: 'var(--red)' }} /><div className="grow"><div style={{ fontSize: 13, fontWeight: 600 }}>Pinned: meeting point</div><div className="tiny">{ev.meet}, {ev.date} {ev.time}</div></div>
      </div>
      <div className="scroll pad" style={{ paddingTop: 14, display: 'flex', flexDirection: 'column', gap: 10 }} aria-live="polite">
        <p className="tiny" style={{ textAlign: 'center' }}>Phone numbers and emails are never shown here. Keep payments inside the app.</p>
        {msgs.map((m) => {
          if (S.blocked.includes(m.from)) return <div key={m.id} className="tiny" style={{ textAlign: 'center' }}>Message from a blocked participant hidden</div>;
          const me = m.from === 'me';
          return (
            <div key={m.id} style={{ display: 'flex', flexDirection: 'column', alignItems: me ? 'flex-end' : 'flex-start' }}>
              {!me && <div className="tiny" style={{ margin: '0 0 3px 4px' }}>{m.from}{m.host ? ' (host)' : ''}{m.ann ? ', announcement' : ''}</div>}
              <div className="row" style={{ gap: 4, flexDirection: me ? 'row-reverse' : 'row', alignItems: 'flex-end', maxWidth: '100%' }}>
                <div className={`msg ${m.ann ? 'ann' : me ? 'me' : 'them'}`}>
                  {m.media ? <Art pal={ev.pal} seed={Math.floor(m.id) % 97} style={{ width: 170, height: 120, borderRadius: 10 }} label="Shared photo, sample" /> : m.text}
                </div>
                {!me && <button className="icon-btn" style={{ width: 32, height: 32, color: 'var(--dim)' }} onClick={() => setMenu(m)} aria-label={`Options for message from ${m.from}`}><Icon n="more" s={16} /></button>}
              </div>
            </div>
          );
        })}
        <div ref={endRef} />
      </div>
      <div className="row" style={{ padding: '10px 12px 24px', gap: 6, borderTop: '1px solid var(--line)' }}>
        <button className="icon-btn" onClick={() => send(true)} aria-label="Share a photo (sample)"><Icon n="image" /></button>
        <input className="input grow" style={{ borderRadius: 999, minHeight: 44 }} value={t} onChange={(e) => setT(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} placeholder={ev.mine ? 'Message (start with ! to announce)' : 'Message the group'} aria-label="Message" />
        <button className="icon-btn" style={{ background: t.trim() ? 'var(--red)' : '#2a2a2a' }} onClick={() => send()} aria-label="Send"><Icon n="send" s={19} /></button>
      </div>
      {people && <Sheet title="Participants" onClose={() => setPeople(false)}>
        <div className="list-row"><Avatar name={hostName} size={36} /><span className="grow">{hostName}</span><span className="badge">Host</span></div>
        {[...ev.attendees, ...(ev.me === 'joined' ? ['You'] : [])].map((a) => <div key={a} className="list-row"><Avatar name={a} size={36} /><span className="grow">{a}</span>{a !== 'You' && (S.blocked.includes(a) ? <span className="tiny">Blocked</span> : <button className="small" style={{ minHeight: 36 }} onClick={() => upd((s) => ({ blocked: [...s.blocked, a] }))}>Block</button>)}</div>)}
      </Sheet>}
      {menu && <Sheet title="Message options" onClose={() => setMenu(null)}>
        <p className="small" style={{ marginBottom: 6 }}>From {menu.from}</p>
        <button className="list-row" onClick={() => { setRep(menu); setMenu(null); }}><Icon n="flag" s={18} />Report message</button>
        {!menu.host && <button className="list-row" onClick={() => { upd((s) => ({ blocked: [...s.blocked, menu.from] })); say(`${menu.from} blocked. You won't see their messages.`); setMenu(null); }}><Icon n="x" s={18} />Block {menu.from}</button>}
      </Sheet>}
      {rep && <ReportSheet target={`"${rep.text || 'Photo'}" from ${rep.from}`} type="Message" onClose={() => setRep(null)} onSend={(reason) => { report({ type: 'Message', target: `${rep.from}: ${rep.text || 'photo'}`, reason }); setRep(null); }} />}
    </>
  );
}

const BUDGET_MAX = { Budget: 1000, 'Mid-range': 1800, Comfort: 99999 };
const PACE_N = { Relaxed: 1, Balanced: 2, Packed: 3 };
function addDays(iso, n) { const d = new Date(iso + 'T00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
function generateTrip(o) {
  const i0 = ROUTE.indexOf(START_REGION[o.start]);
  const route = [...ROUTE.slice(i0), ...ROUTE.slice(0, i0)];
  const k = Math.min(route.length, Math.max(1, Math.ceil(o.days / 2)));
  const pool = EXPS.filter((e) => e.price <= BUDGET_MAX[o.budget] && !(o.access.includes('Limited walking') && e.walk) && !(o.access.includes('Avoid high altitude') && e.alt) && !(o.access.includes('Travelling with young children') && e.cats.includes('Adventure')));
  const score = (e) => e.cats.filter((c) => o.interests.includes(c)).length * 10 + e.rating;
  const used = new Set();
  let prev = null;
  const plan = Array.from({ length: o.days }, (_, d) => {
    const region = route[Math.floor((d * k) / o.days)];
    const stops = [];
    if (prev && region !== prev) stops.push({ type: 'note', text: `Move to ${region}. Travel time not estimated; check roads and weather locally.` });
    pool.filter((e) => e.region === region && !used.has(e.id)).sort((a, b) => score(b) - score(a)).slice(0, PACE_N[o.pace]).forEach((e) => { used.add(e.id); stops.push({ type: 'exp', id: e.id }); });
    let j = 0; while (stops.filter((s) => s.type === 'exp').length + j < Math.min(2, PACE_N[o.pace]) && j < 2) { stops.push({ type: 'note', text: FILLER[region][j] }); j++; }
    prev = region;
    return { region, stops };
  });
  return { id: 't' + uid(), title: `${o.days} days from ${o.start}`, ...o, plan };
}
const tripCost = (t) => t.plan.reduce((a, d) => a + d.stops.reduce((b, s) => b + (s.type === 'exp' ? EXP[s.id].price * t.group : 0), 0), 0);

function MiniMap({ regions }) {

        {regions.slice(1).map((r, k) => <line key={k} x1={pts[regions[k]][0]} y1={pts[regions[k]][1]} x2={pts[r][0]} y2={pts[r][1]} stroke="#E50914" strokeWidth="2" strokeDasharray="5 5" />)}

function TripView({ id }) {
  const { S, upd, push, pop, say } = useApp();
  const t = S.trips.find((x) => x.id === id) || S.trips[0];
  const [addTo, setAddTo] = useState(null);
  const [del, setDel] = useState(false);
  if (!t) return <><Header title="Itinerary" /><Empty icon="map" title="No itinerary yet" cta="Create a trip" onCta={() => push('tripwiz')} /></>;
  const setPlan = (fn) => upd((s) => ({ trips: s.trips.map((x) => (x.id === t.id ? { ...x, plan: fn(x.plan) } : x)) }));
  const mv = (d, i, dir) => setPlan((p) => p.map((day, k) => { if (k !== d) return day; const st = [...day.stops]; const j = i + dir; if (j < 0 || j >= st.length) return day; [st[i], st[j]] = [st[j], st[i]]; return { ...day, stops: st }; }));
  const rm = (d, i) => setPlan((p) => p.map((day, k) => (k === d ? { ...day, stops: day.stops.filter((_, j) => j !== i) } : day)));
  const add = (d, stop) => { setPlan((p) => p.map((day, k) => (k === d ? { ...day, stops: [...day.stops, stop] } : day))); setAddTo(null); };
  const inTrip = new Set(t.plan.flatMap((d) => d.stops.filter((s) => s.type === 'exp').map((s) => s.id)));
  const regions = [...new Set(t.plan.map((d) => d.region))];
  return (
    <>
      <Header title={t.title} sub={`${t.group} traveller${t.group > 1 ? 's' : ''}, ${t.pace.toLowerCase()} pace`} right={<button className="icon-btn" onClick={() => setDel(true)} aria-label="Delete itinerary"><Icon n="trash" s={20} /></button>} />
      <div className="scroll pad">
        <MiniMap regions={regions} />
        <div className="row between panel" style={{ marginTop: 12 }}>
          <div><div className="tiny">Estimated activity cost</div><div style={{ fontWeight: 700, fontSize: 20 }}>{inr(tripCost(t))}</div></div>
          <div className="tiny" style={{ textAlign: 'right', maxWidth: 150 }}>Sample prices x {t.group}. Excludes stays and transport.</div>
        </div>
        {t.plan.map((day, d) => (
          <div key={d} style={{ marginTop: 22 }}>
            <div className="row between"><div><div className="h2">Day {d + 1}</div><div className="small">{addDays(t.date, d)}, {day.region}</div></div>
              <button className="btn btn-ghost btn-sm" onClick={() => setAddTo(d)}><Icon n="plus" s={16} />Add</button></div>
            <div style={{ marginTop: 8, borderLeft: '2px solid #2a2a2a', marginLeft: 6, paddingLeft: 14 }}>
              {day.stops.length === 0 && <p className="small" style={{ padding: '10px 0' }}>Free day. Add an experience or keep it open.</p>}
              {day.stops.map((s, i) => {
                const e = s.type === 'exp' ? EXP[s.id] : null;
                return (
                  <div key={i} className="row" style={{ padding: '10px 0', borderBottom: '1px solid var(--line)', alignItems: 'center' }}>
                    {e ? <Art pal={e.pal} seed={e.seed} shade={false} flags={false} style={{ width: 46, height: 46, borderRadius: 10, flex: 'none' }} /> : <div style={{ width: 46, height: 46, borderRadius: 10, background: 'var(--raise)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', color: 'var(--muted)' }}><Icon n={s.text.startsWith('Move') ? 'map' : 'clock'} s={18} /></div>}
                    <div className="grow">{e ? <><button className="h3" style={{ fontSize: 14.5, textAlign: 'left' }} onClick={() => push('exp', { id: e.id })}>{e.title}</button><div className="tiny">{e.time}, {e.dur}, {inr(e.price)}</div></> : <div className="small" style={{ color: '#ddd' }}>{s.text}</div>}</div>
                    {e && <button className="btn btn-sm btn-red" style={{ minHeight: 32, padding: '0 10px' }} onClick={() => push('book', { id: e.id })}>Book</button>}
                    <div style={{ display: 'flex', flexDirection: 'column' }}>
                      <button className="icon-btn" style={{ width: 30, height: 22 }} onClick={() => mv(d, i, -1)} disabled={i === 0} aria-label="Move up"><Icon n="up" s={16} /></button>
                      <button className="icon-btn" style={{ width: 30, height: 22 }} onClick={() => mv(d, i, 1)} disabled={i === day.stops.length - 1} aria-label="Move down"><Icon n="down" s={16} /></button>
                    </div>
                    <button className="icon-btn" style={{ width: 34, height: 34 }} onClick={() => rm(d, i)} aria-label="Remove stop"><Icon n="x" s={16} /></button>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
        <p className="tiny" style={{ margin: '20px 0' }}>This plan is illustrative. It does not estimate road travel times or check live availability, permits or weather.</p>
        <button className="btn btn-white btn-block" style={{ marginBottom: 30 }} onClick={() => say('Itinerary saved to My Trip')}><Icon n="check" s={18} />Saved to My Trip</button>
      </div>
      {addTo !== null && <Sheet title={`Add to day ${addTo + 1}`} onClose={() => setAddTo(null)}>
        <button className="list-row" onClick={() => add(addTo, { type: 'note', text: 'Free time' })}><Icon n="clock" /><span className="grow">Add free time</span></button>
        <div className="small" style={{ margin: '14px 0 2px' }}>Experiences in {t.plan[addTo].region} first</div>
        {[...EXPS].filter((e) => !inTrip.has(e.id)).sort((a, b) => (b.region === t.plan[addTo].region) - (a.region === t.plan[addTo].region)).map((e) => (
          <button key={e.id} className="list-row" onClick={() => add(addTo, { type: 'exp', id: e.id })}>
            <Art pal={e.pal} seed={e.seed} shade={false} flags={false} style={{ width: 44, height: 44, borderRadius: 10, flex: 'none' }} />
            <div className="grow"><div className="h3" style={{ fontSize: 14.5 }}>{e.title}</div><div className="tiny">{e.region}, {inr(e.price)}</div></div><Icon n="plus" s={18} />
          </button>
        ))}
      </Sheet>}
      {del && <Confirm title="Delete this itinerary?" body="Bookings you've made stay in My Trip." yes="Delete" danger onNo={() => setDel(false)} onYes={() => { upd((s) => ({ trips: s.trips.filter((x) => x.id !== t.id) })); pop(); }} />}
    </>
  );
}

      { id: 2, text: 'Only 2 seats left for Himalayan Birding Trail on Sat 7 Nov', when: '2h ago', go: ['exp', { id: 'e2' }] },

const SCREENS = { exp: ExperienceDetail, book: Booking, checkout: Checkout, result: Result, ticket: Ticket, search: Search, notifs: Notifications, event: EventDetail, story: Story, create: CreateEvent, created: Created, manage: Manage, chat: Chat, host: HostProfile, tripwiz: TripWizard, trip: TripView, profile: Profile, saved: Saved, bookings: Bookings, hostdash: HostDash, admin: AdminDash };
const TABS = [['home', 'Home', 'home'], ['explore', 'Explore', 'compass'], ['community', 'Community', 'users'], ['mytrip', 'My Trip', 'map']];

function App() {
  const [S, setS] = useState(initialState);
  const [tab, setTab] = useState('home');
  const [stack, setStack] = useState([]);
  const [toast, setToast] = useState(null);
  const tRef = useRef();
  const Sref = useRef(S); Sref.current = S;
  const upd = (fn) => setS((s) => ({ ...s, ...fn(s) }));
  const say = (m) => { setToast(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToast(null), 2600); };
  const notify = (text, go) => upd((s) => ({ notifs: [{ id: Date.now() + Math.random(), text, when: 'Just now', go }, ...s.notifs] }));
  const k = () => Date.now() + Math.random();
  const nav = {
    push: (screen, params = {}) => setStack((st) => [...st, { screen, params, key: k() }]),
    pop: () => setStack((st) => st.slice(0, -1)),
    replace: (screen, params = {}) => setStack((st) => [...st.slice(0, -1), { screen, params, key: k() }]),
    resetTo: (t) => { setStack([]); setTab(t); },
    only: (screen, params = {}) => setStack([{ screen, params, key: k() }]),
  };
  const actions = {
    toggleSave: (id, force) => upd((s) => ({ saved: s.saved.includes(id) && !force ? s.saved.filter((x) => x !== id) : s.saved.includes(id) ? s.saved : [...s.saved, id] })),
    book: (o) => {
      const b = { id: 'b' + uid(), ref: 'SE-' + uid(), status: 'confirmed', ...o };
      upd((s) => ({ bookings: [b, ...s.bookings], seats: { ...s.seats, [o.expId]: s.seats[o.expId].map((x, j) => (j === o.d ? x - o.qty : x)) } }));
      notify(`Booking confirmed: ${EXP[o.expId].title}, ${DATES[o.d]}`, ['ticket', { bookingId: b.id }]);
      return b;
    },
    cancelBooking: (id) => {
      const b = Sref.current.bookings.find((x) => x.id === id);
      upd((s) => ({ bookings: s.bookings.map((x) => (x.id === id ? { ...x, status: 'cancelled' } : x)), seats: { ...s.seats, [b.expId]: s.seats[b.expId].map((x, j) => (j === b.d ? x + b.qty : x)) } }));
      say('Booking cancelled. Refund requested (demo).');
    },
    reschedule: (id, nd) => {
      const b = Sref.current.bookings.find((x) => x.id === id);
      upd((s) => ({ bookings: s.bookings.map((x) => (x.id === id ? { ...x, d: nd } : x)), seats: { ...s.seats, [b.expId]: s.seats[b.expId].map((x, j) => (j === b.d ? x + b.qty : j === nd ? x - b.qty : x)) } }));
      say(`Moved to ${DATES[nd]}`);
    },
    joinEvent: (id) => {
      const ev = Sref.current.events.find((e) => e.id === id);
      if (ev.me) return;
      const out = evCount(ev) >= ev.capacity ? 'waitlist' : ev.approval === 'request' ? 'requested' : 'joined';
      upd((s) => ({ events: s.events.map((e) => (e.id === id ? { ...e, me: out } : e)) }));
      say(out === 'joined' ? `You're in. Group chat is now open.` : out === 'requested' ? 'Request sent to the host' : 'Event is full. You\u2019re on the waitlist.');
      if (out === 'joined') notify(`You joined ${ev.title}`, ['event', { id }]);
    },
    leaveEvent: (id) => {
      const ev = Sref.current.events.find((e) => e.id === id);
      const wasJoined = ev.me === 'joined';
      const [first, ...rest] = ev.waitlist;
      upd((s) => ({ events: s.events.map((e) => (e.id !== id ? e : wasJoined && first ? { ...e, me: null, attendees: [...e.attendees, first], waitlist: rest } : { ...e, me: null })) }));
      say(wasJoined && first ? `You left. ${first} moved up from the waitlist.` : 'Removed');
    },
    approveMe: (id) => { upd((s) => ({ events: s.events.map((e) => (e.id === id ? { ...e, me: evCount(e) >= e.capacity ? 'waitlist' : 'joined' } : e)) })); say('The host approved your request'); },
    createEvent: (v) => {
      const fmtDate = new Date(v.date + 'T00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
      const t12 = (t) => { const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}${m ? ':' + String(m).padStart(2, '0') : ''} ${h < 12 ? 'AM' : 'PM'}`; };
      const ev = { id: 'u' + uid(), title: v.title.trim(), host: 'h4', mine: true, area: v.area, date: fmtDate, time: `${t12(v.time)}\u2013${t12(v.end)}`, price: v.paid ? +v.price : 0, capacity: v.capacity, kind: v.kind, approval: v.approval, tags: v.tags, pal: v.pal, img: v.img, seed: 70 + Math.floor(Math.random() * 20), attendees: [], waitlist: [], requests: [], me: null, desc: v.desc.trim(), meet: v.meet.trim(), reqs: v.reqs, status: v.kind === 'pro' ? 'review' : 'published' };
      upd((s) => ({ events: [ev, ...s.events], chats: { ...s.chats, [ev.id]: [] } }));
      return ev;
    },
    report: (r) => { upd((s) => ({ reports: [...s.reports, { id: 'r' + uid(), ...r }] })); say('Report sent to moderators. Thank you.'); },
    setRole: (r) => { upd(() => ({ role: r })); setStack(r === 'host' ? [{ screen: 'hostdash', params: {}, key: k() }] : r === 'admin' ? [{ screen: 'admin', params: {}, key: k() }] : []); },
  };
  const ctx = { S, upd, say, tab, setTab, stackLen: stack.length, ...nav, ...actions };
  const jump = (screen, params) => { if (!S.onboarded) upd(() => ({ onboarded: true })); if (TABS.some((t) => t[0] === screen)) return nav.resetTo(screen); setStack([{ screen, params: params || {}, key: k() }]); };
  const TabScreen = { home: Home, explore: Explore, community: Community, mytrip: MyTrip }[tab];

  return (
    <Ctx.Provider value={ctx}>
      <div className="shell">
        <aside className="map-panel" aria-label="Prototype screen map">
          <h2>Sikkim Experiences</h2>
          <p>Clickable prototype. Use the phone like an app, or jump to any screen below. All data is sample data.</p>
          {[['Tabs', [['home', 'Home'], ['explore', 'Explore reels'], ['community', 'Community'], ['mytrip', 'My Trip']]],
            ['Booking', [['exp', 'Experience details', { id: 'e1' }], ['book', 'Date and guests', { id: 'e1' }], ['checkout', 'Checkout', { id: 'e1', d: 0, qty: 2 }], ['ticket', 'Ticket']]],
            ['Community', [['event', 'Pottery Session in Aritar', { id: 'c1' }], ['event', 'Full event, waitlist', { id: 'c3' }], ['create', 'Create experience'], ['story', 'Story viewer', { index: 0 }], ['host', 'Host profile', { id: 'h4' }]]],
            ['Account and trip', [['search', 'Search and filters'], ['tripwiz', 'Trip wizard'], ['profile', 'Profile and settings'], ['notifs', 'Notifications']]],
          ].map(([g, items]) => <div key={g}><h3>{g}</h3>{items.map(([s, l, p]) => <button key={l} onClick={() => jump(s, p)}>{l}</button>)}</div>)}
          <h3>Roles</h3>
          <button onClick={() => { jump('home'); actions.setRole('host'); }}>Host dashboard</button>
          <button onClick={() => { jump('home'); actions.setRole('admin'); }}>Admin dashboard</button>
          <button onClick={() => { setS(initialState()); setStack([]); setTab('home'); }}>Restart from onboarding</button>
        </aside>
        <div className="phone">
          {!S.onboarded ? <Onboarding /> : <>
            <div className="layer">
              <TabScreen />
              <nav className="tabbar" aria-label="Main">
                {TABS.map(([id, label, ic]) => (
                  <button key={id} className="tab" aria-current={tab === id ? 'page' : undefined} onClick={() => { setTab(id); setStack([]); }}>
                    <Icon n={ic} s={23} sw={tab === id ? 2.4 : 1.8} /><span>{label}</span><span className="pip" />
                  </button>
                ))}
              </nav>
            </div>
            {stack.map((st, i) => {
              const C = SCREENS[st.screen];
              return <div key={st.key} className="layer over" style={{ display: i === stack.length - 1 ? 'flex' : 'none' }}><C {...st.params} /></div>;
            })}
          </>}
          {toast && <div className="toast" role="status">{toast}</div>}
        </div>
      </div>
    </Ctx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
